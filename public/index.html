<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机狐狸</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; background: #1a1a2e;
           color: #eee; font-family: sans-serif; }
    img { max-width: 90vw; max-height: 70vh; border-radius: 12px;
          box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    button { margin-top: 24px; padding: 12px 32px; font-size: 16px;
             border: 0; border-radius: 8px; background: #e94560; color: #fff;
             cursor: pointer; }
    button:hover { opacity: .85; }
    p { margin-top: 12px; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <img id="fox" alt="随机狐狸">
  <button onclick="pick()">再来一张</button>
  <p>接口: /random  |  /list</p>
  <script>
    function pick() {
      document.getElementById('fox').src = '/random?redirect=1&t=' + Date.now();
    }
    pick();
  </script>
</body>
</html>
